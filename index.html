    const raw = [
      ["slope", "/slop/", ["slope"], 0, "n.", "A surface or piece of land that is higher at one end than the other.", "斜坡；坡地", "-", ["grassy slope|長滿草的斜坡", "steep slope|陡坡", "slide down a slope|從斜坡滑下"], "The children enjoyed sliding down the grassy slope in the park.", "孩子們喜歡從公園裡長滿草的斜坡滑下來。", "slope"],
      ["tumble", "/ˈtʌmbḷ/", ["tum", "ble"], 0, "vi.", "To fall down quickly and suddenly, especially with a rolling movement.", "滾落", "-", ["tumble down|滾落", "tumble off|從...滾落", "tumble down the stairs|從樓梯滾下"], "The books tumbled off the shelf during the earthquake and were scattered across the floor.", "地震期間，書本從架上滾落，散落一地。", "tumbled"],
      ["bruised", "/bruzd/", ["bruised"], 0, "adj.", "Showing or having blue, black, or purple skin due to an injury.", "瘀傷的；碰傷的", "bruise (vt.) 使出現瘀傷；bruise (n.) 瘀傷", ["bruised arm|瘀青的手臂", "bruised and sore|瘀青又疼痛", "badly bruised|嚴重瘀傷"], "The day after her scooter accident, Rachel’s right arm was bruised and sore.", "騎機車出事故的隔天，瑞秋的右手臂瘀青又疼痛。", "bruised"],
      ["bruise", "/bruz/", ["bruise"], 0, "vt.", "To cause blue, black, or purple skin by hitting or hurting a part of the body.", "使出現瘀傷；撞傷", "bruised (adj.) 瘀傷的；bruise (n.) 瘀傷", ["bruise one’s elbow|撞傷手肘", "bruise easily|容易瘀青", "bruise one’s knee|膝蓋撞出瘀青"], "Scott slipped on the ice and bruised his elbow three days ago; it’s still blue and sore today.", "史考特三天前在冰上滑倒撞傷了手肘，今天還是又青又痛。", "bruised"],
      ["bruise", "/bruz/", ["bruise"], 0, "n.", "A blue, black, or purple mark on the skin caused by an injury.", "瘀傷；碰傷", "bruised (adj.) 瘀傷的；bruise (vt.) 使出現瘀傷", ["bumps and bruises|碰撞與瘀傷", "a bruise on one’s leg|腿上的瘀青", "a dark bruise|深色的瘀傷"], "The cowboy got some bumps and bruises when the bull threw him off, but fortunately, he didn’t suffer a worse fate.", "牛仔被公牛甩下時受了些碰撞和瘀傷，但幸運的是，他沒有遭遇更糟的下場。", "bruises"],
      ["superior", "/səˈpɪrɪɚ/", ["su", "pe", "ri", "or"], 1, "adj.", "Better or greater than someone or something else.", "優於；更好的", "superior (n.) 上司；superiority (n.) 優越", ["superior to|優於", "superior quality|優質", "feel superior|覺得高人一等"], "Many people believe that fresh fruit is superior to canned fruit. They say it tastes better and is healthier.", "許多人認為新鮮水果優於罐頭水果。他們說它嘗起來更好，也更健康。", "superior"],
      ["superior", "/səˈpɪrɪɚ/", ["su", "pe", "ri", "or"], 1, "n.", "A person of higher rank or position at work.", "上司；上級", "superior (adj.) 優於；superiority (n.) 優越", ["report to one’s superior|向上司報告", "immediate superior|直屬上司", "superiors and subordinates|上司與下屬"], "Lucy’s manager is her superior at work. She must report everything to him.", "露西的經理是她工作上的上司。她必須向他報告一切。", "superior"],

    // --- 主應用程式元件 ---
    function App() {
      const [user, setUser] = useState({ classNum: '', seatNum: '', name: '' });
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [view, setView] = useState('learn');
      const [xp, setXp] = useState(0);
      const [level, setLevel] = useState(1);

      const [currentWordIndex, setCurrentWordIndex] = useState(0);
      const [quizList, setQuizList] = useState([]);
      const [quizIndex, setQuizIndex] = useState(0);

      // --- 後台資料庫 (Google Apps Script) 追蹤狀態 ---
      const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbyldJ5h0tm2i6q3giG4mwlCpQqLIux7Yca9mMTd558tlSqnAP0kAwh7fRjuh0Mx3aPn/exec'; // <--- ★ 部署時，請將您發布的 GAS 網址貼在這裡 ★
      const [sessionStartTime, setSessionStartTime] = useState(Date.now());
      const [sessionScore, setSessionScore] = useState(0);

      useEffect(() => { setLevel(Math.floor(xp / 50) + 1); }, [xp]);

      const handleLogin = (userData) => {
        setUser(userData);
        setCurrentWordIndex(0);
        setSessionScore(0);
        setSessionStartTime(Date.now());
        setIsLoggedIn(true);
      };

      const playAudio = (text) => {
        const utterance = new SpeechSynthesisUtterance(cleanWord(text));
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      };

      const sendRecordToGAS = (targetViewToRecord, isCompleted = false) => {
        if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.includes('請貼上')) return;
        const durationSecs = Math.round((Date.now() - sessionStartTime) / 1000);
        const mins = Math.floor(durationSecs / 60);
        const secs = durationSecs % 60;
        const durationStr = mins > 0 ? `${mins}分${secs}秒` : `${secs}秒`;
        let displayScore = targetViewToRecord === 'learn' ? `${sessionScore}題` : `${sessionScore}/15`;
        const payload = {
          classNum: user.classNum, seatNum: user.seatNum, name: user.name,
          mode: targetViewToRecord.toUpperCase(), score: displayScore,
          duration: durationStr, completed: isCompleted ? "Y" : "N"
        };
        fetch(GAS_WEB_APP_URL, {
          method: 'POST', mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).catch(err => console.error("GAS Error:", err));
      };

      const changeView = (newView) => {
        if (['learn', 'prospeak', 'spellit', 'fillin'].includes(view) && newView !== view) {
          const isCompleted = (view !== 'learn' && quizIndex >= 14);
          sendRecordToGAS(view, isCompleted);
        }
        if (['learn', 'prospeak', 'spellit', 'fillin'].includes(newView) && newView !== view) {
          setSessionScore(0);
          setSessionStartTime(Date.now());
        }
        setView(newView);
      };

      const startQuiz = (mode) => {
        const shuffled = [...vocabularyBank].sort(() => 0.5 - Math.random()).slice(0, 15);
        setQuizList(shuffled);
        setQuizIndex(0);
        changeView(mode);
      };

      const nextLearnWord = () => { setCurrentWordIndex((prev) => (prev + 1) % vocabularyBank.length); };

      const nextQuizQuestion = () => {
        if (quizIndex < 14) {
          setQuizIndex(quizIndex + 1);
        } else {
          showToast('測驗完成！', 'success');
          changeView('coach');
        }
      };

      const [toastMsg, setToastMsg] = useState(null);
      const showToast = (msg, type = 'success') => {
        setToastMsg({ text: msg, type });
        setTimeout(() => setToastMsg(null), 2000);
      };

      if (!isLoggedIn) return <LoginScreen onLogin={handleLogin} />;

      return (
        <div className="min-h-screen bg-[#fae8eb] p-4 font-sans text-black selection:bg-indigo-300 flex justify-center pb-20">
          <div className="w-full max-w-md flex flex-col gap-4">

            {toastMsg && (
              <div className={`fixed top-4 left-1/2 -translate-x-1/2 z-50 px-6 py-3 rounded-full font-bold border-2 border-black shadow-[4px_4px_0_0_#000] animate-bounce ${toastMsg.type === 'success' ? 'bg-green-400' : 'bg-red-400'}`}>
                {toastMsg.text}
              </div>
            )}

            <BrutalContainer className="bg-white flex justify-between items-center p-3">
              <div className="flex items-center gap-2">
                <div className="w-8 h-8 rounded-full bg-yellow-300 border-2 border-black flex items-center justify-center">
                  <Icons.Lightning />
                </div>
                <div>
                  <h1 className="font-black text-xl italic text-indigo-600 leading-none">VOCAB<span className="text-pink-500">POP</span></h1>
                  <p className="text-xs text-gray-500 font-bold">👤 {user.classNum}班 {user.seatNum}號 {user.name}</p>
                </div>
              </div>
              <div className="bg-black text-white px-3 py-1.5 rounded-full text-sm font-bold flex gap-2 items-center">
                <span className="text-yellow-400">★ LV.{level}</span>
                <span className="text-gray-400">|</span>
                <span>{xp} XP</span>
              </div>
            </BrutalContainer>

            {['learn', 'coach'].includes(view) && (
              <div className="flex gap-4">
                <BrutalButton onClick={() => changeView('learn')} className={`flex-1 py-3 flex items-center justify-center gap-2 text-lg ${view === 'learn' ? 'bg-[#93c5fd]' : 'bg-white'}`}>
                  <Icons.Book /> LEARN
                </BrutalButton>
                <BrutalButton onClick={() => changeView('coach')} className={`flex-1 py-3 flex items-center justify-center gap-2 text-lg ${view === 'coach' ? 'bg-[#fbcfe8]' : 'bg-white'}`}>
                  <Icons.Brain /> COACH
                </BrutalButton>
              </div>
            )}

            {!['learn', 'coach'].includes(view) && (
              <div className="flex justify-between items-center">
                <BrutalButton onClick={() => changeView('coach')} className="bg-white px-4 py-2 flex items-center gap-2 text-sm">
                  <Icons.Exit /> EXIT
                </BrutalButton>
                <div className="bg-white border-2 border-black font-black px-4 py-1 rounded-full text-sm shadow-[2px_2px_0_0_#000]">
                  {quizIndex + 1} / 15
                </div>
              </div>
            )}

            <div className="flex-1 mt-2 flex flex-col">
              {view === 'learn' && <LearnMode data={vocabularyBank[currentWordIndex]} playAudio={playAudio} onNext={nextLearnWord} onScore={() => {setXp(xp + 10); setSessionScore(s => s + 1); showToast('+10 XP!');}} />}
              {view === 'coach' && <CoachMenu startQuiz={startQuiz} />}
              {view === 'prospeak' && <ProSpeakMode data={quizList[quizIndex]} playAudio={playAudio} onNext={nextQuizQuestion} onScore={() => {setXp(xp + 15); setSessionScore(s => s + 1); showToast('+15 XP!');}} />}
              {view === 'spellit' && <SpellItMode data={quizList[quizIndex]} playAudio={playAudio} onNext={nextQuizQuestion} onScore={() => {setXp(xp + 20); setSessionScore(s => s + 1); showToast('+20 XP!');}} />}
              {view === 'fillin' && <FillInMode data={quizList[quizIndex]} onNext={nextQuizQuestion} onScore={() => {setXp(xp + 20); setSessionScore(s => s + 1); showToast('+20 XP!');}} />}
            </div>
          </div>
        </div>
      );
    }

    // --- 學習模式 (Learn Mode) ---
    function LearnMode({ data, playAudio, onNext, onScore }) {
      const [cards, setCards] = useState([]);
      const [selectedCards, setSelectedCards] = useState([]);
      const [matchedIds, setMatchedIds] = useState([]);
      const topRef = useRef(null);

      useEffect(() => {
        requestAnimationFrame(() => {
          if (topRef.current) topRef.current.scrollIntoView({ behavior: 'auto', block: 'start' });
          window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
        });
        playAudio(data.word);
        const initialCards = [];
        data.matchPairs.forEach((pair, idx) => {
          initialCards.push({ text: pair.en, type: 'en', id: idx });
          initialCards.push({ text: pair.zh, type: 'zh', id: idx });
        });
        setCards(initialCards.sort(() => 0.5 - Math.random()));
        setSelectedCards([]);
        setMatchedIds([]);
      }, [data]);

      const handleCardClick = (card) => {
        if (matchedIds.includes(card.id)) return;
        if (selectedCards.some(c => c.text === card.text)) return;
        if (selectedCards.length === 2) return;
        const newSelected = [...selectedCards, card];
        setSelectedCards(newSelected);
        if (newSelected.length === 1) {
          playTone('click');
          if (card.type === 'en') playAudio(card.text);
        } else if (newSelected.length === 2) {
          if (newSelected[0].id === newSelected[1].id && newSelected[0].type !== newSelected[1].type) {
            playTone('correct');
            const newMatchedCount = matchedIds.length + 1;
            setMatchedIds(prev => [...prev, newSelected[0].id]);
            setSelectedCards([]);
            if (newMatchedCount === data.matchPairs.length) onScore();
          } else {
            playTone('wrong');
            setTimeout(() => setSelectedCards([]), 800);
          }
        }
      };

      return (
        <BrutalContainer className="bg-white overflow-hidden flex flex-col mb-4 h-full">
          <div ref={topRef}></div>
          <div className="bg-[#4f46e5] text-white p-6 pb-8 relative flex flex-col items-center text-center">
            <div className="absolute inset-0 opacity-20 pointer-events-none" style={{ backgroundImage: 'radial-gradient(#ffffff 2px, transparent 2px)', backgroundSize: '16px 16px' }}></div>
            <div className="bg-black text-white text-xs font-bold px-3 py-1 rounded-full self-start mb-4 relative z-10 border-2 border-white">{data.pos}</div>
            <div className="bg-white/20 px-3 py-1 rounded-md text-sm font-mono tracking-widest mb-2 relative z-10">{data.kk}</div>
            <h2 className="text-4xl font-black mb-4 relative z-10 tracking-tight">{data.word}</h2>
            <div className="flex gap-2 mb-6 relative z-10 flex-wrap justify-center">
              {data.syllables.map((syl, i) => (
                <span key={i} className={`px-3 py-1 rounded text-sm font-bold shadow-sm transition-all ${data.stressIndex === i ? 'bg-yellow-400 text-black border-[2px] border-black shadow-[2px_2px_0_0_#000] scale-110 z-10' : 'bg-white/30 text-white border-[2px] border-transparent'}`}>{syl}</span>
              ))}
            </div>
            <button onClick={() => { playTone('click'); playAudio(data.word); }} className="bg-white text-black w-16 h-16 rounded-full flex items-center justify-center border-[3px] border-black shadow-[4px_4px_0_0_#000] hover:translate-y-[2px] hover:shadow-[2px_2px_0_0_#000] active:translate-y-[4px] active:shadow-none transition-all relative z-10">
              <Icons.Volume />
            </button>
          </div>

          <div className="p-6 flex flex-col gap-6 flex-1">
            <div>
              <h3 className="font-black text-xl flex items-center gap-2 mb-2">
                <span className="w-3 h-3 bg-yellow-400 rounded-full border-2 border-black inline-block"></span> Meaning
              </h3>
              <p className="text-gray-700 font-medium pl-4 border-l-[3px] border-gray-200 text-lg">
                {data.meaning} <span className="text-indigo-600 font-bold ml-1">({data.chinese})</span>
              </p>
            </div>

            {data.wordFamily !== "-" && (
              <div className="bg-indigo-50 border-2 border-indigo-200 rounded-xl p-4">
                <p className="text-indigo-600 font-bold text-sm mb-2 uppercase tracking-wide">🔗 Word Family & Collocations:</p>
                <div className="flex flex-col gap-2">
                  <div className="bg-white border border-indigo-200 rounded-lg px-3 py-2 text-sm font-medium text-gray-800">{data.wordFamily}</div>
                  <div className="bg-white border border-indigo-200 rounded-lg px-3 py-2 text-sm font-bold text-indigo-700 italic flex justify-between">" {data.matchPairs[0].en} "</div>
                </div>
              </div>
            )}

            <div>
              <h3 className="font-black text-xl flex items-center gap-2 mb-2">
                <span className="w-3 h-3 bg-green-400 rounded-full border-2 border-black inline-block"></span> Example
              </h3>
              <div className="bg-gray-50 border-2 border-gray-200 rounded-xl p-4 flex flex-col gap-2">
                <span className="text-gray-700 italic text-base leading-relaxed">"{data.example}"</span>
                <span className="text-indigo-700 font-bold text-sm border-t-2 border-gray-200 pt-2">{data.exampleChinese}</span>
              </div>
            </div>

            <div className="bg-pink-50 border-2 border-pink-200 rounded-xl p-4 mt-2 mb-4">
              <h4 className="font-bold text-pink-600 mb-1 flex items-center gap-2">✨ Mini Match (中英搭配詞)</h4>
              <p className="text-sm font-bold text-gray-700 mb-3">請將下方的英文與對應的中文配對：</p>
              <div className="grid grid-cols-2 gap-3">
                {cards.map((card, i) => {
                  const isSelected = selectedCards.some(c => c.text === card.text);
                  const isMatched = matchedIds.includes(card.id);
                  let btnClass = "bg-white text-gray-800 border-pink-200 hover:bg-pink-100";
                  if (isMatched) btnClass = "bg-green-400 text-black border-black border-2 shadow-[2px_2px_0_0_#000] opacity-60 cursor-not-allowed";
                  else if (isSelected) btnClass = "bg-yellow-300 text-black border-black border-2 shadow-[2px_2px_0_0_#000]";
                  return (
                    <button key={i} onClick={() => handleCardClick(card)} className={`p-4 rounded-lg font-bold text-[13px] transition-all border-2 ${btnClass}`}>{card.text}</button>
                  );
                })}
              </div>
            </div>
          </div>

          <div className="p-4 pt-0 w-full mt-auto">
            <BrutalButton onClick={(e) => { if (e && e.currentTarget) e.currentTarget.blur(); onNext(); }} className="w-full bg-black text-white py-4 text-lg shadow-[4px_4px_0_0_#cbd5e1] hover:bg-gray-800">
              NEXT WORD →
            </BrutalButton>
          </div>
        </BrutalContainer>
      );
    }

    // --- 發音挑戰 (Pro Speak) ---
    function ProSpeakMode({ data, playAudio, onNext, onScore }) {
      const [status, setStatus] = useState('idle');
      const [transcript, setTranscript] = useState('');

      const handleListen = () => {
        playTone('click');
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          setStatus('error');
          setTranscript('瀏覽器不支援，請使用 Chrome 或允許麥克風權限。');
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => { setStatus('listening'); setTranscript(''); };

        recognition.onresult = (event) => {
          const speechResult = event.results[0][0].transcript.toLowerCase().trim();
          setTranscript(speechResult);
          const strip = (s) => s.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()’']/g, "").replace(/\s+/g, " ").trim();
          const cleanResult = strip(speechResult);
          const cleanTarget = strip(cleanWord(data.word).toLowerCase());
          if (cleanResult.includes(cleanTarget) || cleanTarget.includes(cleanResult)) {
            playTone('correct'); setStatus('success'); onScore();
          } else {
            playTone('wrong'); setStatus('error');
          }
        };

        recognition.onerror = (event) => {
          setStatus('error');
          if (event.error === 'not-allowed') setTranscript('麥克風權限被拒絕，請允許權限或點擊跳過。');
          else setTranscript('發生錯誤: ' + event.error);
        };

        recognition.onend = () => { if (status === 'listening') setStatus('idle'); };
        recognition.start();
      };

      return (
        <BrutalContainer className="bg-white p-6 flex flex-col items-center text-center min-h-[400px]">
          <div className="self-end bg-gray-200 px-3 py-1 rounded-full text-sm font-bold mb-4">VOCAB <span className="text-indigo-600">PRO</span></div>
          <h2 className="text-4xl font-black mt-8 mb-4">{data.word}</h2>
          <div className="bg-gray-100 px-4 py-2 rounded-lg font-mono text-lg tracking-widest mb-12 border-2 border-gray-300">{data.kk}</div>

          <button onClick={handleListen} className={`w-32 h-32 rounded-full border-[4px] border-black shadow-[6px_6px_0_0_#000] flex items-center justify-center transition-all ${status === 'listening' ? 'bg-red-400 animate-pulse translate-y-[2px] shadow-[4px_4px_0_0_#000]' : 'bg-[#fde047] hover:bg-yellow-300'}`}>
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{MicShape}</svg>
          </button>

          <div className="mt-8 font-bold text-lg min-h-[2rem]">
            {status === 'listening' && <span className="text-red-500">Listening...</span>}
            {status === 'success' && <span className="text-green-500">Excellent! ({transcript})</span>}
            {status === 'error' && <span className="text-red-500">{transcript.includes('瀏覽器') || transcript.includes('權限') || transcript.includes('錯誤') ? transcript : `Heard: "${transcript}". Try again!`}</span>}
            {status === 'idle' && <span>TAP TO RECORD</span>}
          </div>

          <div className="mt-auto w-full pt-6 flex flex-col gap-3">
            {status === 'success' ? (
              <BrutalButton onClick={() => {setStatus('idle'); onNext();}} className="w-full bg-black text-white py-4 text-lg">NEXT QUESTION →</BrutalButton>
            ) : (
              <button onClick={() => {setStatus('idle'); onNext();}} className="text-gray-400 text-sm font-bold hover:text-gray-600 underline py-2">無法使用麥克風？點此跳過此題</button>
            )}
          </div>
        </BrutalContainer>
      );
    }

    // --- 聽寫測驗 (Spell It) ---
    function SpellItMode({ data, playAudio, onNext, onScore }) {
      const [input, setInput] = useState('');
      const [status, setStatus] = useState('idle');
      const spellTarget = cleanWord(data.word);

      useEffect(() => {
        playAudio(data.word);
        setInput('');
        setStatus('idle');
      }, [data]);

      const handleCheck = () => {
        const norm = (s) => s.toLowerCase().replace(/’/g, "'").replace(/\s+/g, ' ').trim();
        if (norm(input) === norm(spellTarget)) {
          playTone('correct'); setStatus('success'); onScore();
        } else {
          playTone('wrong'); setStatus('error');
        }
      };

      return (
        <BrutalContainer className="bg-[#fff7ed] p-6 flex flex-col items-center text-center">
          <div className="w-full flex justify-end mb-4">
            <span className="bg-gray-200 px-3 py-1 rounded-full text-sm font-bold text-gray-600">DICTATION</span>
          </div>

          <button onClick={() => { playTone('click'); playAudio(data.word); }} className="w-24 h-24 bg-[#a5b4fc] rounded-full border-[3px] border-black shadow-[4px_4px_0_0_#000] flex items-center justify-center mb-8 hover:bg-indigo-300 transition-colors hover:translate-y-[2px] active:translate-y-[4px] active:shadow-none">
            <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{VolShape}</svg>
          </button>

          <p className="text-lg font-bold text-gray-800 mb-4 px-4 border-l-4 border-indigo-400 text-left w-full">
            "{data.meaning}" <br/>
            <span className="text-indigo-600 text-sm mt-1 block">({data.chinese})</span>
          </p>

          <div className="bg-black text-white px-4 py-1 rounded-full text-sm font-bold mb-8">
            {data.pos} • {spellTarget.length} letters/chars
          </div>

          <input
            type="text"
            value={input}
            onChange={(e) => {setInput(e.target.value); setStatus('idle');}}
            placeholder="Type here..."
            className={`w-full text-center text-3xl font-black p-4 bg-transparent border-b-4 outline-none transition-colors ${status === 'error' ? 'border-red-500 text-red-600' : 'border-indigo-500 text-indigo-900'}`}
          />
          {status === 'error' && <p className="text-red-500 font-bold mt-2">Try again!</p>}

          <div className="mt-12 w-full">
            {status === 'success' ? (
              <BrutalButton onClick={onNext} className="w-full bg-green-400 py-4 text-xl">CORRECT! NEXT →</BrutalButton>
            ) : (
              <BrutalButton onClick={handleCheck} className="w-full bg-black text-white py-4 text-xl">CHECK ANSWER</BrutalButton>
            )}
          </div>
        </BrutalContainer>
      );
    }

    // 從字典字根 (data.word，可能包含 "..." 或括號) 取出可比對的基礎詞形
    function getBaseTokens(baseWordField) {
      return cleanWord(baseWordField).split(/\s+/).filter(Boolean);
    }

    // 比對此字與所有基礎詞形，找出最長共同字首，推算「時態/型態變化」字尾並完整顯示
    function buildBlank(word, baseTokens) {
      const lw = word.toLowerCase();
      if (word.length <= 2) return "_ ".repeat(word.length).trim();

      let bestPrefixLen = 0;
      baseTokens.forEach(bt => {
        const lbt = bt.toLowerCase();
        let len = 0;
        const maxLen = Math.min(lw.length, lbt.length);
        while (len < maxLen && lw[len] === lbt[len]) len++;
        if (len > bestPrefixLen) bestPrefixLen = len;
      });

      const suffixLen = word.length - bestPrefixLen;

      if (bestPrefixLen >= 1 && suffixLen >= 1) {
        const middleLen = word.length - 1 - suffixLen;
        const suffix = word.slice(word.length - suffixLen).split('').join(' ');
        return word[0] + (middleLen > 0 ? ' ' + "_ ".repeat(middleLen).trim() : '') + ' ' + suffix;
      }
      return word[0] + ' ' + "_ ".repeat(Math.max(word.length - 2, 0)).trim() + ' ' + word[word.length - 1];
    }

    // --- 填充測驗 (Fill In) 支援片語拆解 ---
    function FillInMode({ data, onNext, onScore }) {
      const [input, setInput] = useState('');
      const [status, setStatus] = useState('idle');
      const [showHint, setShowHint] = useState(false);

      useEffect(() => { setInput(''); setStatus('idle'); setShowHint(false); }, [data]);

      const targetWord = data.targetInExample;
      const baseTokens = getBaseTokens(data.word);
      const blankStr = targetWord.split(' ').map(w => buildBlank(w, baseTokens)).join('   ');

      const parts = data.example.split(new RegExp(`\\b${targetWord}\\b`, 'i'));
      const renderPrefix = parts[0] !== undefined ? parts[0] : "";
      const renderSuffix = parts[1] !== undefined ? parts[1] : "";

      const handleCheck = () => {
        const norm = (s) => s.toLowerCase().replace(/’/g, "'").replace(/\s+/g, ' ').trim();
        if (norm(input) === norm(targetWord)) {
          playTone('correct'); setStatus('success'); onScore();
        } else {
          playTone('wrong'); setStatus('error');
        }
      };

      return (
        <BrutalContainer className="bg-white p-6">
          <div className="flex justify-between items-center mb-6">
            <span className="bg-pink-100 text-pink-700 border-2 border-pink-300 px-3 py-1 rounded-md text-sm font-bold shadow-sm">Grammar & Collocation</span>
            <span className="text-gray-400 font-bold text-sm">FILL IN</span>
          </div>

          <div className="text-2xl font-medium leading-relaxed mb-8 text-gray-800">
            {renderPrefix}
            <span className="inline-block mx-2 border-b-4 border-black px-2 pb-1 font-mono font-bold text-orange-500 bg-orange-50 relative top-1">{blankStr}</span>
            {renderSuffix}
          </div>

          <button onClick={() => { playTone('click'); setShowHint(!showHint); }} className="text-blue-600 font-bold text-sm hover:underline mb-4">
            {showHint ? "Hide Translation (Hint)" : "Show Translation (Hint)"}
          </button>

          {showHint && (
            <div className="bg-blue-50 border-l-4 border-blue-400 p-3 mb-6 text-gray-700 font-medium rounded-r-lg text-sm">中譯提示：{data.exampleChinese}</div>
          )}

          <div className="mt-4">
            <input
              type="text"
              value={input}
              onChange={(e) => {setInput(e.target.value); setStatus('idle');}}
              placeholder="Type the missing part..."
              className={`w-full border-2 border-black rounded-xl p-4 text-xl font-bold outline-none focus:ring-4 focus:ring-orange-200 transition-all shadow-[4px_4px_0_0_#000] ${status === 'error' ? 'bg-red-50 text-red-600 border-red-500' : 'bg-white text-black'}`}
            />
          </div>

          {status === 'error' && <p className="text-red-500 font-bold mt-3 text-center">Incorrect, check your spelling!</p>}

          <div className="mt-8">
            {status === 'success' ? (
              <BrutalButton onClick={onNext} className="w-full bg-green-400 py-4 text-xl">AWESOME! NEXT →</BrutalButton>
            ) : (
              <BrutalButton onClick={handleCheck} className="w-full bg-black text-white py-4 text-xl">CHECK ANSWER</BrutalButton>
            )}
          </div>
        </BrutalContainer>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
